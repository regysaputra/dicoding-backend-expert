name: cd.yml
on:
  push:
    branches:
      - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
        - name: SSH and deploy app
          uses: appleboy/ssh-action@master
          with:
            host: ${{ vars.SSH_HOST }}
            username: ${{ vars.SSH_USERNAME }}
            key: ${{ secrets.SSH_KEY }}
            port: ${{ vars.SSH_PORT }}
            script: |
              if [ -d "$HOME/dicoding-backend-expert" ]; then
                echo "Directory exists. Pulling latest changes..."
                cd $HOME/dicoding-backend-expert
                git pull origin main
              else
                echo "Directory does not exist. Cloning repository..."
                git clone https://github.com/regysaputra/dicoding-backend-expert.git
                cd $HOME/dicoding-backend-expert
              fi
              
              echo ${{ vars.PGHOST }}
              echo ${{ vars.PGHOST_TEST }}
              
              # create .env file
              cat <<EOF > .env
              NODE_ENV=production
              HOST=${{ vars.HOST }}
              PORT=${{ vars.PORT }}
              PGHOST=${{ vars.PGHOST }}
              PGPORT=${{ vars.PGPORT }}
              PGUSER=${{ vars.PGUSER }}
              PGPASSWORD=${{ secrets.PGPASSWORD }}
              PGDATABASE=${{ vars.PGDATABASE }}
              ACCESS_TOKEN_KEY=${{ secrets.ACCESS_TOKEN_KEY }}
              REFRESH_TOKEN_KEY=${{ secrets.REFRESH_TOKEN_KEY }}
              ACCCESS_TOKEN_AGE=${{ vars.ACCESS_TOKEN_AGE }}
              EOF
              
              # create .test.env file
              cat <<EOF > .test.env
              NODE_ENV=test
              PGHOST=${{ vars.PGHOST_TEST }}
              PGPORT=${{ vars.PGPORT_TEST }}
              PGPASSWORD=${{ secrets.PGPASSWORD_TEST }}
              PGUSER=${{ vars.PGUSER_TEST }}
              PGDATABASE=${{ vars.PGDATABASE_TEST }}
              PGSSLMODE=no-verify
              ACCESS_TOKEN_KEY=${{ secrets.ACCESS_TOKEN_KEY }}
              REFRESH_TOKEN_KEY=${{ secrets.REFRESH_TOKEN_KEY }}
              ACCCESS_TOKEN_AGE=${{ vars.ACCESS_TOKEN_AGE }}
              EOF
              
              npm ci --omit=dev --no-audit --no-fund
              npm run migrate:test -- up
              npm run migrate up
              
              # Start or restart the app using the production environment block
              pm2 startOrReload ecosystem.config.cjs --env production
              pm2 save